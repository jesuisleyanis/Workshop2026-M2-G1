# nginx non-root (utilisateur nginx, port 8080) servant le build Vite statique.
# En prod ce conteneur est derrière le WAF (seul point exposé) : le WAF route
# "/" vers ce conteneur et "/api/v1/*" vers auth / payment-api.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;

  # Répertoires temporaires inscriptibles sans root.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Assets Vite hachés : cache long.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA : toute route inconnue renvoie index.html (jamais mise en cache).
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store";
      try_files $uri /index.html;
    }
  }
}
