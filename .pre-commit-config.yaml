# Hooks pre-commit — qualité et sécurité (installer : pre-commit install)
# Non branché en CI pour l'instant (décision équipe) ; exécution locale.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks           # empêche tout secret en clair d'être commité (R13)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff               # lint Python
        args: [--fix]
      - id: ruff-format        # format Python

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]   # bloque les artefacts volumineux (modèles, dumps)
