# Liste blanche STRICTE pour le docker-socket-proxy (alternative durcie aux variables
# CONTAINERS/POST/ALLOW_RESTARTS de tecnativa/docker-socket-proxy, qui ouvrent des SECTIONS
# entières de l'API : avec CONTAINERS=1 + POST=1, `POST /containers/create` serait permis,
# donc un conteneur privilégié, donc root sur l'hôte).
#
# Ici seuls 4 couples (méthode, chemin) passent. Tout le reste : 403.
# Montage : ce fichier -> /usr/local/etc/haproxy/haproxy.cfg ; docker.sock monté UNIQUEMENT
# dans ce conteneur (jamais dans remediation), en lecture seule.
global
    log stdout format raw local0 info
    maxconn 32

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 60s

frontend docker_in
    bind :2375
    acl m_get   method GET HEAD
    acl m_post  method POST
    acl p_ping    path_reg ^(/v[0-9.]+)?/_ping$
    acl p_list    path_reg ^(/v[0-9.]+)?/containers/json$
    acl p_inspect path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/json$
    acl p_restart path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/restart$
    http-request allow if m_get  p_ping
    http-request allow if m_get  p_list
    http-request allow if m_get  p_inspect
    http-request allow if m_post p_restart
    http-request deny deny_status 403
    default_backend docker_socket

backend docker_socket
    server dockersock unix@/var/run/docker.sock
