; Projet PlatformIO — objet connecté ESP8266 + LED bicolore (consigne additionnelle 1).
; IDE imposé : JetBrains CLion + PlatformIO. Voir README.md et CAHIER-DES-CHARGES.md.

[platformio]
default_envs = nodemcuv2

; --- Carte cible : ESP8266 (NodeMCU v2 / Wemos D1) -------------------------------
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
; La ROM de l'ESP8266 écrit aussi à 74880 bauds au démarrage.
monitor_speed = 74880
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0

; --- Tests unitaires de la machine à états, exécutés sur le PC (sans matériel) ----
; `pio test -e native` : compile lib/led + test/ (pas src/main.cpp, qui dépend d'Arduino :
; test_build_src reste à `no` par défaut). La logique LED est donc testée hors carte.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
