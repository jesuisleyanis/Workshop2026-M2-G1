# Alertmanager — route les alertes SOC vers le moteur de remédiation (webhook authentifié).
# Chemin SECONDAIRE de déclenchement (le détecteur ML reste le principal) — ticket #13 / I6.
# Source : règles Prometheus infra/prometheus/rules/soc.yml (miroir des règles Grafana SOC).
global:
  resolve_timeout: 1m

route:
  receiver: remediation
  group_by: ['incident_type', 'service']
  group_wait: 1s
  group_interval: 30s
  repeat_interval: 5m          # ré-émission idempotente côté moteur (event_id = fingerprint + startsAt)

receivers:
  - name: remediation
    webhook_configs:
      # POST /events/alertmanager : adaptateur Alertmanager -> AnomalyEvent (§3) côté moteur
      # (remediation/alertmanager.py). Authentification : Bearer interne REMEDIATION_TOKEN, lu dans
      # un secret Compose (jamais en clair dans ce fichier versionné). Seules les alertes `firing`
      # comptent (send_resolved: false) ; une alerte sans label incident_type est ignorée par le moteur.
      - url: 'http://remediation:8005/events/alertmanager'
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/remediation_token
