# Prometheus — scrape des services RESILIENCE-ALPHA (métriques du contrat §2)
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Fonction SOC → remédiation (I6, ticket #13) : règles Prometheus (miroir des règles Grafana) évaluées
# ici, routées par Alertmanager (profil `full`) vers POST /events/alertmanager du moteur.
# Sans Alertmanager (profil `demo`), Prometheus journalise seulement des erreurs de résolution DNS :
# le chemin principal detector → /events n'en dépend pas.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8001"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8002"]

  - job_name: face-id
    metrics_path: /metrics
    static_configs:
      - targets: ["face-id:8006"]

  - job_name: detector
    metrics_path: /metrics
    static_configs:
      - targets: ["detector:8003"]

  - job_name: remediation
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation:8005"]

  - job_name: waf-exporter
    # Conteneur dédié (security/waf/Dockerfile.exporter) qui suit l'audit log ModSecurity du WAF.
    static_configs:
      - targets: ["waf-exporter:9188"]

  # Profil full :
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["pg-exporter:9187"]
