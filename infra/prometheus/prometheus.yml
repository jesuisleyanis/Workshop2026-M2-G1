# Prometheus — scrape des services RESILIENCE-ALPHA (métriques du contrat §2)
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8001"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8002"]

  - job_name: detector
    metrics_path: /metrics
    static_configs:
      - targets: ["detector:8003"]

  - job_name: remediation
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation:8005"]

  - job_name: waf-exporter
    static_configs:
      - targets: ["waf-exporter:9188"]

  # Profil full :
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["pg-exporter:9187"]
