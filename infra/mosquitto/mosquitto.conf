# Broker MQTT du pilotage LED (consigne additionnelle 1, ADR 0006).
# Durci : pas d'accès anonyme, authentification + ACL par topic. Le bind sur l'interface
# hotspot (192.168.137.1) se fait au niveau de la publication de port Docker (voir README),
# pas ici : le broker écoute sur son conteneur, Docker restreint l'exposition réseau.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

persistence false
log_dest stdout
log_type warning
log_type notice

# TLS (8883) optionnel en recette — voir README (certificats montés en lecture seule).
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
