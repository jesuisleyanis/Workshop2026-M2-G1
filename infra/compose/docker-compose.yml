# RESILIENCE-ALPHA — orchestration Docker Compose
# Profils : (défaut=demo) chemin critique | full=observabilité complète | attack=banc d'essai | ai=assistant RAG
# Secrets injectés depuis ../../.env (produit par scripts/decrypt-secrets.sh à partir de SOPS).
# Durcissement : non-root (Dockerfiles), cap_drop ALL, no-new-privileges, limites ressources,
# seul le WAF publie des ports. Voir ../../security/hardening/hardening.md.

name: resilience-g1

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

x-pylimits: &pylimits
  mem_limit: 512m
  cpus: 0.75

networks:
  edge:
  app:
  data:
    internal: true
  obs:

volumes:
  # Journal d'audit ModSecurity : EN MÉMOIRE (non persistant), borné, dossier 0750
  # nginx:nginx (lu par waf-exporter via son groupe). Il peut contenir la donnée appariée
  # par une règle (cf. security/waf/README.md) : il ne doit ni survivre ni grossir sans fin.
  waf-logs:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64m,uid=101,gid=101,mode=0750" }
  pgdata:
  grafana-data:
  loki-data:
  chroma-data:
  ollama-models:

services:

  # ---------------------------------------------------------------- edge (exposé)
  waf:
    <<: *hardening
    build: { context: ../../security/waf }
    networks: [edge, app]
    # Le conteneur écoute 8080/8443 (non-root, cap_drop ALL : pas de port < 1024).
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      # DOSSIER (pas le fichier) en lecture seule : la liste est écrite par le moteur de
      # remédiation (même dossier, monté en écriture là-bas) par renommage atomique ; un bind
      # mount de fichier garderait l'ancien inode. Le WAF surveille le dossier et se recharge
      # (98-blocklist-watch.sh). Un WAF compromis ne peut pas débloquer lui-même une source.
      - ../../security/waf/blocklist:/etc/nginx/blocklist:ro
      - waf-logs:/var/log/modsec            # journal d'audit ModSecurity -> waf-exporter
    depends_on: [front, payment-api, auth]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    # Healthcheck : celui du Dockerfile (https://127.0.0.1:8443/healthz).
    # Non read_only : l'entrypoint de l'image OWASP rend sa conf et son certificat au
    # démarrage dans /etc/nginx et /etc/modsecurity.d (un tmpfs masquerait les règles CRS) ;
    # risque résiduel documenté dans security/waf/README.md.

  # Journal d'audit ModSecurity -> resilience_waf_blocked_total (+ event waf_blocked).
  # Lecture seule, aucun port publié, réseau obs uniquement (scrapé par Prometheus).
  waf-exporter:
    <<: *hardening
    build: { context: ../../security/waf, dockerfile: Dockerfile.exporter }
    networks: [obs]
    volumes:
      - waf-logs:/var/log/modsec:ro
    group_add: ["101"]                      # groupe nginx : lecture du journal (dossier 0750)
    read_only: true
    depends_on: [waf]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32

  # ---------------------------------------------------------------- app (métier)
  front:
    <<: *hardening
    build: { context: ../../services/front }
    networks: [app]
    environment:
      VITE_API_BASE: "/api/v1"
    mem_limit: 128m

  payment-api:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: services/payment-api/Dockerfile }
    networks: [app, data]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [postgres]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  auth:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: services/auth/Dockerfile }
    networks: [app, data]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Solde fictif des comptes créés par /register (make seed) : sans lui (défaut 0),
      # tout virement répond 409 insufficient_funds et verify_tx ne peut jamais réussir.
      # 1 000 € = ~10 000 vérifications à 1 € ; le trafic de démo vire entre comptes seedés.
      REGISTER_INITIAL_BALANCE_CENTS: "100000"
    depends_on: [postgres]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- data (interne)
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    networks: [data]
    # Démarre directement en utilisateur postgres (uid 70 de l'image alpine) : l'entrypoint
    # saute alors chown/gosu et cap_drop ALL suffit (aucun cap_add). Le volume NOMMÉ pgdata
    # hérite à sa création du propriétaire postgres du dossier de l'image (un bind mount
    # appartenant à root, lui, ne marcherait pas).
    user: postgres
    read_only: true
    tmpfs: ["/var/run/postgresql", "/tmp"]   # socket unix + fichiers temporaires
    environment:
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilience"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- ML (AIOps)
  collector:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: ml/collector/Dockerfile }
    networks: [app, obs]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    depends_on: [prometheus]
    read_only: true
    tmpfs: ["/tmp"]

  detector:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: ml/detector/Dockerfile }
    networks: [app, obs]
    environment:
      # URL COMPLÈTE de l'endpoint (le detector POSTe tel quel, cf. ml/detector/core.py)
      REMEDIATION_URL: http://remediation:8005/events
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN}
    depends_on: [collector, remediation]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- remédiation
  docker-socket-proxy:
    # Proxy strict basé sur la config haproxy de la remédiation (ADR 0002) :
    # n'autorise QUE 4 couples (méthode, chemin), dont POST /containers/{id}/restart.
    # Plus restrictif que tecnativa (CONTAINERS=1+POST=1 ouvrirait /containers/create).
    <<: *hardening
    image: haproxy:2.9-alpine
    networks: [app]
    volumes:
      - ../../remediation/proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # socket monté UNIQUEMENT ici, en lecture seule
    mem_limit: 64m

  remediation:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: remediation/Dockerfile }
    # jamais sur edge. `obs` : lecture de Loki (source du blocage, confirm_waf_block) — voir
    # ROADMAP I14 (segmentation) : pas de port publié, Loki n'écoute que sur ce réseau interne.
    networks: [app, obs]
    volumes:
      # Liste de blocage du WAF : seul dossier inscriptible du moteur avec son journal. Même
      # dossier que le WAF (qui le monte en lecture seule). `make up` le prépare (droits).
      - ../../security/waf/blocklist:/var/lib/waf-blocklist
    environment:
      BLOCKLIST_PATH: /var/lib/waf-blocklist/blocked_ips.conf
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      AUTH_URL: http://auth:8002
      # verify_tx (copié dans l'image en /opt/scripts/verify_tx, cf. Dockerfile) passe par le
      # WAF comme un vrai client : depuis le réseau app, waf:8443 (et non https://localhost).
      BASE_URL: https://waf:8443
    depends_on: [docker-socket-proxy]
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- dashboard
  dashboard:
    <<: *hardening
    build: { context: ../../dashboard }
    networks: [app]
    environment:
      VITE_REMEDIATION_BASE: http://remediation:8005
    mem_limit: 128m

  # ---------------------------------------------------------------- observabilité
  prometheus:
    <<: *hardening
    image: prom/prometheus:latest
    networks: [app, obs]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 384m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]

  loki:
    <<: *hardening
    image: grafana/loki:latest
    networks: [obs]
    volumes:
      - ../loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    mem_limit: 384m

  promtail:
    <<: *hardening
    image: grafana/promtail:latest
    networks: [obs]
    volumes:
      - ../promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    mem_limit: 128m

  grafana:
    <<: *hardening
    image: grafana/grafana:latest
    networks: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m

  # ---- observabilité complète (profil full) ----
  alertmanager:
    <<: *hardening
    image: prom/alertmanager:latest
    profiles: [full]
    networks: [obs, app]
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    mem_limit: 128m

  cadvisor:
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: [full]
    networks: [obs]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 128m

  pg-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:latest
    profiles: [full]
    networks: [data, obs]
    environment:
      DATA_SOURCE_NAME: "postgresql://resilience:${POSTGRES_PASSWORD}@postgres:5432/resilience?sslmode=disable"
    depends_on: [postgres]
    mem_limit: 64m

  # ---------------------------------------------------------------- assistant RAG (profil ai)
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    networks: [app]
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 8g          # lourd — déporter sur le PC IA si la RAM est serrée
    restart: unless-stopped

  assistant:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: assistant/Dockerfile }
    profiles: [ai]
    networks: [app]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - chroma-data:/app/chroma
      - ../../docs:/app/docs:ro
    depends_on: [ollama]
    tmpfs: ["/tmp"]

  # ---------------------------------------------------------------- banc d'essai (profil attack)
  attacker:
    image: curlimages/curl:latest
    profiles: [attack]
    networks: [edge]       # rejoue depuis le PC Hôte en dev ; en démo : PC Attaquant physique
    entrypoint: ["sleep", "infinity"]
    mem_limit: 64m
