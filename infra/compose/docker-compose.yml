# RESILIENCE-ALPHA — orchestration Docker Compose
# Profils : (défaut=demo) chemin critique | full=observabilité complète | iot=broker MQTT | attack=banc d'essai | ai=assistant RAG
# Secrets injectés depuis ../../.env (produit par scripts/decrypt-secrets.sh à partir de SOPS).
# Durcissement : non-root (Dockerfiles), cap_drop ALL, no-new-privileges, limites ressources,
# seul le WAF publie des ports HTTP ; le profil iot publie MQTT sur le hotspot.
# Voir ../../security/hardening/hardening.md.
# Reproductibilité (R5) : toutes les images tierces sont épinglées à une version précise (aucun
# `:latest`) — un rebuild ultérieur ne doit pas tirer un major différent (Grafana/Loki/Prometheus…).

name: resilience-g1

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

x-pylimits: &pylimits
  mem_limit: 512m
  cpus: 0.75

networks:
  edge:
  app:   # non `internal` : seul réseau avec sortie (pull d'images, modèles Ollama). Aucun `ports:`.
  data:
    internal: true
  obs:
    internal: true   # observabilité : aucun besoin de sortie Internet (P4S-02)

# Secret Compose alimenté depuis .env (SOPS) : monté en fichier dans Alertmanager (credentials_file),
# jamais écrit dans alertmanager.yml (fichier versionné).
# Requiert Docker Compose >= 2.23.1 (source `environment:` des secrets) ; sinon, remplacer par
# `file: ../../.remediation_token` (fichier à extraire manuellement de .env, hors git ; voir README-SOC.md).
secrets:
  remediation_token:
    environment: REMEDIATION_TOKEN

volumes:
  pgdata:
  remediation-journal:  # journal d'incidents SQLite du moteur (/var/lib/remediation), persistant
  waf-deny:        # deny-list Nginx partagée WAF (lecture) <-> remediation (écriture via playbook)
  waf-logs:        # audit log ModSecurity (JSON) : WAF (écriture) -> waf-exporter (lecture)
  grafana-data:
  loki-data:
  chroma-data:
  ollama-models:

services:

  # ---------------------------------------------------------------- edge (exposé)
  waf:
    <<: *hardening
    build: { context: ../../security/waf }
    networks: [edge, app]
    # Image non-root (nginx unprivileged) : écoute 8080/8443 ; seuls 80/443 sont publiés côté hôte.
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      # Audit ModSecurity (blocages 4xx/5xx, JSON Serial) écrit dans le volume partagé lu par waf-exporter (#12).
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsec/audit.json
    volumes:
      - waf-deny:/etc/nginx/deny:rw
      - waf-logs:/var/log/modsec:rw
    depends_on: [front, payment-api, auth]
    mem_limit: 256m
    healthcheck:
      # /healthz est servi par le WAF lui-même (sans upstream) ; cert auto-signé -> -k.
      test: ["CMD-SHELL", "curl -fsk https://127.0.0.1:8443/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  waf-exporter:
    # Blocages ModSecurity -> resilience_waf_blocked_total{rule} (contrat §2) + log waf_blocked (§1).
    # Signal dominant de l'incident_type web_attack (feature ML waf_blocked_per_s, règle SOC soc-waf-blocks).
    # Suit le journal d'audit du WAF via le volume `waf-logs` (lecture seule) ; /metrics :9188 sur `obs` uniquement.
    <<: *hardening
    build: { context: ../.., dockerfile: security/waf/Dockerfile.exporter }
    networks: [obs]
    volumes:
      - waf-logs:/var/log/modsec:ro
    group_add: ["101"]         # groupe nginx : lecture garantie même si l'audit log est créé en 0640
    depends_on: [waf]
    read_only: true
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9188/metrics').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------- app (métier)
  front:
    <<: *hardening
    build: { context: ../../services/front }
    networks: [app]
    environment:
      VITE_API_BASE: "/api/v1"
    # nginx non-root n'écrit que dans /tmp (pid + temp paths, voir services/front/docker/nginx.conf) :
    # racine en lecture seule possible, comme le dashboard.
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 128m

  payment-api:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: services/payment-api/Dockerfile }
    networks: [app, data]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [postgres]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  auth:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: services/auth/Dockerfile }
    networks: [app, data]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on: [postgres]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2.0.18
    profiles: [iot]
    user: "1883:1883"
    networks: [app]
    # Seule l'interface du point d'accès est joignable par l'ESP8266. Hors hotspot (poste de
    # dev), MQTT_BIND_ADDR=127.0.0.1 ; jamais 0.0.0.0 (cf. docs/network.md).
    ports: ["${MQTT_BIND_ADDR:-192.168.137.1}:1883:1883"]
    environment:
      MQTT_AUTH_PASSWORD: ${MQTT_AUTH_PASSWORD:-}
      MQTT_LED_PASSWORD: ${MQTT_LED_PASSWORD:-}
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ../mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
    # Le fichier de mots de passe est généré au démarrage en RAM, jamais dans le dépôt.
    tmpfs:
      - "/run/mosquitto:uid=1883,gid=1883,mode=0700"
      - "/tmp:uid=1883,gid=1883,mode=0700"  # mosquitto_passwd écrit un fichier temporaire
    read_only: true
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/mosquitto/passwd && nc -z 127.0.0.1 1883"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------- data (interne)
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    # Démarre DIRECTEMENT en `postgres` (uid/gid 70 dans l'image alpine) : l'entrypoint officiel
    # saute alors les chown/gosu qui exigent CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER — compatible
    # avec `cap_drop: ALL` sans aucun `cap_add` (ticket #11). Le volume nommé `pgdata` hérite de
    # l'appartenance 70:70 du répertoire de l'image à sa création. Voir security/hardening/hardening.md.
    user: "70:70"
    networks: [data]
    environment:
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilience"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- ML (AIOps)
  collector:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: ml/collector/Dockerfile }
    networks: [app, obs]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    depends_on: [prometheus]
    read_only: true
    tmpfs: ["/tmp"]
    profiles: [ml]

  detector:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: ml/detector/Dockerfile }
    networks: [app, obs]
    environment:
      # URL COMPLÈTE de l'endpoint (le detector POSTe tel quel, cf. ml/detector/core.py)
      REMEDIATION_URL: http://remediation:8005/events
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN}
    depends_on: [collector, remediation]
    read_only: true
    tmpfs: ["/tmp"]
    profiles: [ml]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- remédiation
  docker-socket-proxy:
    # Proxy strict basé sur la config haproxy de la remédiation (ADR 0002) :
    # n'autorise QUE 5 couples (méthode, chemin) : ping/list/inspect, POST .../restart et
    # POST .../kill?signal=HUP (reload à chaud du WAF) — jamais exec/create/kill arbitraire.
    # Plus restrictif que tecnativa (CONTAINERS=1+POST=1 ouvrirait /containers/create).
    <<: *hardening
    image: haproxy:2.9-alpine
    networks: [app]
    volumes:
      - ../../remediation/proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # `:ro` n'empêche AUCUN appel d'API sur un socket Unix : la restriction effective vient
      # de la liste blanche haproxy (5 couples). Ce montage sert cette médiation ; le moteur
      # de remédiation, lui, ne monte jamais le socket et parle HTTP au proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

  remediation:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: remediation/Dockerfile }
    # app : API + proxy Docker + WAF (verify_tx) ; data : pg_restore (correction de corruption).
    # Jamais sur edge, aucun `ports:`.
    networks: [app, data]
    environment:
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      AUTH_URL: http://auth:8002
      # verify_tx : rejoué à travers le WAF (réseau app, cert auto-signé) avec le jeu fictif seedé
      BASE_URL: https://waf
      VERIFY_PASSWORD: ${SEED_PASSWORD}
      # restore_pg_dump : playbook pg_restore.yml dans ce conteneur (client PG 16, réseau data)
      POSTGRES_HOST: postgres
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # waf_block_ip : deny-list partagée + SIGHUP du service `waf` via le proxy
      WAF_SERVICE: waf
    volumes:
      - waf-deny:/etc/resilience/waf-deny:rw                 # écrite par waf_deny_ip.yml
      - ../../infra/ansible/backups:/opt/backups:ro          # dumps sains (pg_backup.yml côté hôte)
      - remediation-journal:/var/lib/remediation:rw          # journal d'incidents SQLite (persistant, survit au redémarrage)
    group_add: ["101"]         # groupe nginx du WAF : droit d'écrire dans le volume waf-deny
    depends_on: [docker-socket-proxy, postgres]
    # Racine en lecture seule (CDC §5.4) : seuls points inscriptibles = volume journal, volume
    # waf-deny partagé, et /tmp (tmpfs) pour les artefacts ansible-runner (ANSIBLE_HOME/LOCAL_TEMP/PRIVATE_DATA_DIR).
    read_only: true
    tmpfs: ["/tmp"]            # artefacts ansible-runner
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- dashboard
  dashboard:
    <<: *hardening
    build: { context: ../../dashboard }
    # Le navigateur ne parle qu'au nginx du dashboard (same-origin, CSP connect-src 'self') :
    # /remediation/stream -> remediation:8005/stream (Bearer injecté côté serveur),
    # /prometheus/api/v1/query -> prometheus:9090 (score ML + santé, GET lecture seule).
    # VITE_* sont des build-args Vite, pas des variables runtime : la base /remediation est le défaut du build.
    networks: [app]
    environment:
      REMEDIATION_UPSTREAM: remediation:8005
      REMEDIATION_AUTH_HEADER: "Bearer ${REMEDIATION_TOKEN}"
      PROMETHEUS_UPSTREAM: prometheus:9090
    depends_on: [remediation, prometheus]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------- observabilité
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1
    networks: [app, obs]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro        # règles SOC (I6) -> alertmanager
    mem_limit: 384m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2h"]

  loki:
    <<: *hardening
    image: grafana/loki:3.2.1
    networks: [obs]
    volumes:
      - ../loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    mem_limit: 384m

  promtail:
    <<: *hardening
    image: grafana/promtail:3.2.1
    networks: [obs]
    volumes:
      - ../promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Accès API complet au démon (découverte des logs de conteneurs) : `:ro` ne le limite pas.
      # Risque accepté — hors moteur de remédiation, réseau `obs` interne uniquement.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    mem_limit: 128m

  grafana:
    <<: *hardening
    image: grafana/grafana:11.3.0
    networks: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD requis (voir security/sops/secrets.example.env) — jamais de repli silencieux sur "admin"}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m

  # ---- observabilité complète (profil full) ----
  alertmanager:
    # Chemin SOC -> remédiation (I6, #13) : reçoit les alertes des règles Prometheus et poste
    # POST /events/alertmanager (Bearer interne via le secret `remediation_token`). Réseau `app`
    # requis pour joindre le moteur ; aucun port publié.
    # Risque résiduel P4S-01 (docs/ebios-rm.md) : l'API Alertmanager (:9093) n'a pas d'auth propre
    # et reste joignable depuis `app` ; un conteneur `app` compromis pourrait forger une alerte.
    # Durcissement cible : réseau `soc` dédié (internal) prometheus<->alertmanager<->remediation.
    <<: *hardening
    image: prom/alertmanager:v0.27.0
    profiles: [full]
    networks: [obs, app]
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets: [remediation_token]
    mem_limit: 128m

  cadvisor:
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: [full]
    networks: [obs]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro   # expose aussi docker.sock à cadvisor (métriques) ; réseau `obs` interne
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 128m

  pg-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: [full]
    networks: [data, obs]
    environment:
      DATA_SOURCE_NAME: "postgresql://resilience:${POSTGRES_PASSWORD}@postgres:5432/resilience?sslmode=disable"
    depends_on: [postgres]
    mem_limit: 64m

  # ---------------------------------------------------------------- assistant RAG (profil ai)
  ollama:
    # Durcissement comme les autres conteneurs (no-new-privileges + cap_drop ALL) : le serveur
    # Ollama tourne en user space et n'a besoin d'aucune capability.
    <<: *hardening
    image: ollama/ollama:0.3.14
    profiles: [ai]
    networks: [app]
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 8g          # lourd — déporter sur le PC IA si la RAM est serrée

  assistant:
    <<: [*hardening, *pylimits]
    build: { context: ../.., dockerfile: assistant/Dockerfile }
    profiles: [ai]
    networks: [app]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - chroma-data:/app/chroma
      - ../../docs:/app/docs:ro
    depends_on: [ollama]
    tmpfs: ["/tmp"]

  # ---------------------------------------------------------------- banc d'essai (profil attack)
  attacker:
    image: curlimages/curl:8.10.1
    profiles: [attack]
    networks: [edge]       # rejoue depuis le PC Hôte en dev ; en démo : PC Attaquant physique
    entrypoint: ["sleep", "infinity"]
    mem_limit: 64m
