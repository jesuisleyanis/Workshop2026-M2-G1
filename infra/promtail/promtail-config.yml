# Promtail — collecte les logs JSON des conteneurs (driver Docker) vers Loki.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      # Masquage AVANT Loki de ce que le WAF écrit sur stderr (error_log nginx, niveau `warn`) :
      # chaque ligne d'erreur nginx recopie la requête (`request: "GET /p?token=X HTTP/1.1"`,
      # `upstream: "..."`, `referrer: "..."`) et les lignes « ModSecurity: Access denied » portent
      # la donnée appariée `[data "..."]` et la valeur `(Value: `...' )`, qui peuvent contenir le
      # contenu de la requête (mot de passe d'un login bloqué...). `replace` n'efface que le groupe
      # capturé : méthode, chemin, hôte, id de règle restent. Test : infra/tests/test_promtail.py.
      - replace:
          expression: '(?:request|upstream|referrer): "[^"?]*(\?[^" ]*)[^"]*"'
          replace: ''
      - replace:
          expression: '\[data "((?:[^"\\]|\\.)*)"\]'
          replace: ''
      - replace:
          expression: 'Value: `(.*?)'' \)'
          replace: ''
      # Les services émettent du JSON (contrat §1) : on parse les champs clés
      # pour les rendre requêtables et alimenter les règles SOC.
      - json:
          expressions:
            level: level
            service: service
            event: event
            client_ip: client_ip
            http_status: http_status
      - labels:
          level:
          event:
