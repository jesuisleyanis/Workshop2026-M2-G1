# Inventaire Ansible — RESILIENCE-ALPHA
# Déploiement local sur le PC Hôte (connexion locale, pas de SSH requis).
[host]
localhost ansible_connection=local

[host:vars]
# Racine du dépôt déduite de l'emplacement de cet inventaire (<racine>/infra/ansible/inventory) :
# portable, sans override. Surcharge possible : -e project_root=/chemin
project_root={{ inventory_dir | dirname | dirname | dirname }}
compose_file={{ project_root }}/infra/compose/docker-compose.yml
