apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus          # référencé par les règles SOC (datasourceUid: prometheus)
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki                # référencé par les règles SOC basées logs
    type: loki
    access: proxy
    url: http://loki:3100
