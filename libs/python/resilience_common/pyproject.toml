[project]
name = "resilience-common"
version = "1.0.0"
description = "Librairie partagée RESILIENCE-ALPHA : logging JSON, métriques, schémas d'interface."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "prometheus-fastapi-instrumentator>=7.0"]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
