# WAF RESILIENCE-ALPHA — Nginx + ModSecurity + OWASP CRS
# SEUL point exposé de la plateforme (80/443). Reverse-proxy vers front + APIs.
# Basé sur l'image owasp/modsecurity-crs:nginx (ModSecurity + CRS préinstallés).

load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs JSON exploitables par Promtail/Loki (fonction SOC).
    log_format json_waf escape=json
      '{"ts":"$time_iso8601","service":"waf","event":"http_request",'
      '"client_ip":"$remote_addr","http_method":"$request_method",'
      '"http_path":"$uri","http_status":$status,'
      '"duration_ms":$request_time,"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.json json_waf;
    error_log  /var/log/nginx/error.log warn;

    # ModSecurity + OWASP CRS activés globalement.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/setup.conf;

    # --- Liste de blocage IP rechargeable à chaud ---------------------------
    # L'action de remédiation waf_block_ip ajoute une ligne "deny <ip>;" dans
    # ce fichier puis déclenche `nginx -s reload`. Interface documentée dans README.
    geo $blocked_source {
        default 0;
        include /etc/nginx/blocked_ips.conf;
    }

    upstream front_app    { server front:80; }
    upstream payment_api  { server payment-api:8001; }
    upstream auth_api     { server auth:8002; }

    server {
        listen 443 ssl;
        listen 80;
        server_name _;

        ssl_certificate     /etc/nginx/tls/server.crt;   # auto-signé (généré au build)
        ssl_certificate_key /etc/nginx/tls/server.key;

        # Blocage des sources mises en liste noire par la remédiation.
        if ($blocked_source) { return 403; }

        # En-têtes de sécurité
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Front de paiement (statique)
        location / {
            proxy_pass http://front_app;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API métier
        location /api/v1/accounts      { proxy_pass http://payment_api; proxy_set_header X-Forwarded-For $remote_addr; }
        location /api/v1/transactions  { proxy_pass http://payment_api; proxy_set_header X-Forwarded-For $remote_addr; }

        # API d'authentification (rate-limit applicatif en plus du CRS)
        location /api/v1/login     { proxy_pass http://auth_api; proxy_set_header X-Forwarded-For $remote_addr; }
        location /api/v1/register  { proxy_pass http://auth_api; proxy_set_header X-Forwarded-For $remote_addr; }
    }
}
