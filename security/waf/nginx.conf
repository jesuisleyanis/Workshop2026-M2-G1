# WAF RESILIENCE-ALPHA — Nginx + ModSecurity + OWASP CRS
# SEUL point exposé HTTP de la plateforme (80/443 côté hôte, + 9443 en loopback pour le back-office). Reverse-proxy vers front + APIs.
# Basé sur l'image owasp/modsecurity-crs:*-nginx-alpine (ModSecurity + CRS préinstallés),
# qui tourne NON-ROOT : écoute 8080/8443 (Compose publie 80->8080, 443->8443), pid et
# répertoires temporaires dans /tmp.

load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 30;

    # Répertoires temporaires inscriptibles sans root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Logs JSON sur stdout, exploitables par Promtail/Loki (fonction SOC).
    log_format json_waf escape=json
      '{"ts":"$time_iso8601","service":"waf","event":"http_request",'
      '"client_ip":"$remote_addr","http_method":"$request_method",'
      '"http_path":"$uri","http_status":$status,'
      '"duration_ms":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json_waf;

    # ModSecurity + OWASP CRS activés globalement. setup.conf est rendu par l'entrypoint
    # de l'image (modsecurity.conf + crs-setup.conf + règles CRS) ; l'audit log ModSecurity
    # (JSON, blocages uniquement) est écrit dans /var/log/modsec/audit.json
    # (MODSEC_AUDIT_LOG, volume `waf-logs` lu par waf-exporter), pas sur stdout.
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # --- Liste de blocage IP rechargeable à chaud ---------------------------
    # Volume partagé `waf-deny` : l'action de remédiation waf_block_ip (playbook
    # waf_deny_ip.yml) ajoute une ligne "<ip> 1;" puis envoie SIGHUP à ce conteneur
    # (= `nginx -s reload`) via le docker-socket-proxy. Interface documentée dans README.
    geo $blocked_source {
        default 0;
        include /etc/nginx/deny/blocked_ips.conf;
    }

    # Le conteneur front (nginx non-root) écoute sur 8080, pas 80.
    upstream front_app    { server front:8080; }
    upstream payment_api  { server payment-api:8001; }
    upstream auth_api     { server auth:8002; }
    upstream backoffice_app { server backoffice:8080; }

    server {
        listen 8443 ssl;
        listen 8080;
        http2 on;
        server_name _;

        # Certificat auto-signé généré au build de l'image (voir Dockerfile).
        ssl_certificate     /etc/nginx/conf/server.crt;
        ssl_certificate_key /etc/nginx/conf/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:WAF:10m;

        # Blocage des sources mises en liste noire par la remédiation.
        if ($blocked_source) { return 403; }

        # En-têtes de sécurité
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Sonde de vie du WAF lui-même (HEALTHCHECK de l'image / Compose) : ne touche aucun upstream.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Front de paiement (statique)
        location / {
            proxy_pass http://front_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API métier
        location /api/v1/accounts      { proxy_pass http://payment_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/transactions  { proxy_pass http://payment_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }

        # API d'authentification (rate-limit applicatif en plus du CRS)
        location /api/v1/login     { proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/register  { proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }

        # Routes réservées au listener hôte (9443) : le serveur public répond 404, jamais de proxy vers auth.
        # `^~` : prioritaire sur toute location regex/préfixe plus court.
        location ^~ /api/v1/auth/  { return 404; }
        location ^~ /api/v1/admin/ { return 404; }

        # Jamais routés : /internal/*, /metrics des services, moteur de remédiation, dashboard interne.
    }

    # --- Listener HÔTE (9443) : back-office + API d'authentification v2/admin ------------------------------
    # Publié par Compose sur 127.0.0.1 uniquement ("127.0.0.1:9443:9443") : joignable depuis le PC Hôte, jamais
    # depuis le réseau hotspot. Seul endroit où /api/v1/auth/ et /api/v1/admin/ sont routés vers auth.
    # La CSP / Permissions-Policy (camera=(self)) du back-office viennent de son propre nginx : le WAF
    # n'ajoute volontairement aucun en-tête Permissions-Policy ici (il pourrait le contredire).
    server {
        listen 9443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/conf/server.crt;
        ssl_certificate_key /etc/nginx/conf/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:WAF:10m;

        if ($blocked_source) { return 403; }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Images de capture faciale (JSON base64) : plafonnées à 4 Mo.
        client_max_body_size 4m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Back-office (statique, nginx non-root)
        location / {
            proxy_pass http://backoffice_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Authentification v2 (visage / mot de passe) et administration des agents
        location /api/v1/auth/  { proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/admin/ { proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    }
}
