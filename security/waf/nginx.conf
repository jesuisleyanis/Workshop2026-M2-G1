# WAF RESILIENCE-ALPHA — Nginx + ModSecurity + OWASP CRS
# Seul point d'entrée HTTP (80/443 côté hôte). MQTT est publié séparément sur le PA.
# Basé sur l'image owasp/modsecurity-crs:*-nginx-alpine (ModSecurity + CRS préinstallés),
# qui tourne NON-ROOT : écoute 8080/8443 (Compose publie 80->8080, 443->8443), pid et
# répertoires temporaires dans /tmp.

load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 30;

    # Répertoires temporaires inscriptibles sans root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Logs JSON sur stdout, exploitables par Promtail/Loki (fonction SOC).
    log_format json_waf escape=json
      '{"ts":"$time_iso8601","service":"waf","event":"http_request",'
      '"client_ip":"$remote_addr","http_method":"$request_method",'
      '"http_path":"$uri","http_status":$status,'
      '"duration_ms":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json_waf;

    # ModSecurity + OWASP CRS activés globalement. setup.conf est rendu par l'entrypoint
    # de l'image (modsecurity.conf + crs-setup.conf + règles CRS) ; l'audit log ModSecurity
    # (JSON, blocages uniquement) est écrit dans /var/log/modsec/audit.json
    # (MODSEC_AUDIT_LOG, volume `waf-logs` lu par waf-exporter), pas sur stdout.
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # --- Liste de blocage IP rechargeable à chaud ---------------------------
    # Volume partagé `waf-deny` : l'action de remédiation waf_block_ip (playbook
    # waf_deny_ip.yml) ajoute une ligne "<ip> 1;" puis envoie SIGHUP à ce conteneur
    # (= `nginx -s reload`) via le docker-socket-proxy. Interface documentée dans README.
    # --- IP réelle du client (mode REAL_IP=1 uniquement, cf. docker-entrypoint.d/06-trust-forwarded.sh) ---
    # Vide par défaut. En mode REAL_IP, $remote_addr devient l'IP transmise par le proxy natif Windows
    # (Caddy) : blocage `geo`, limitation de débit et X-Forwarded-For vers les API visent le VRAI client.
    include /etc/nginx/conf/realip.conf;

    geo $blocked_source {
        default 0;
        include /etc/nginx/deny/blocked_ips.conf;
    }

    # --- Limitation de débit de l'API (protection PRÉVENTIVE de la disponibilité) ----------
    # Indépendante de la détection : écrête un flood avant qu'il n'atteigne l'API. Clé = IP source,
    # mais sous Docker Desktop tous les clients externes arrivent avec l'IP de la passerelle du réseau
    # edge : la limite est alors de fait GLOBALE, d'où un seuil large (trafic légitime ~5 req/s).
    # verify_tx (remédiation, IP interne distincte) a son propre compteur : jamais écrêté par l'attaque.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Route publique /api/v1/status (#42) : limitée par IP (le polling client est à 1 req/15 s),
    # en plus du cache de 2 s côté payment-api.
    limit_req_zone $binary_remote_addr zone=status_per_ip:1m rate=2r/s;

    # Bénéficiaires (#43) : un POST résout un IBAN -> borne l'énumération par IP.
    limit_req_zone $binary_remote_addr zone=beneficiaries_per_ip:1m rate=30r/m;
    # Statistiques (#44) : agrégat SQL par requête, une par écran ouvert -> borne par IP.
    limit_req_zone $binary_remote_addr zone=stats_per_ip:1m rate=60r/m;
    # Détail d'opération par id (#45) : borne le balayage d'ids par IP. Le préfixe
    # /api/v1/transactions (POST de virement, cible légitime de service_flood) n'est PAS limité.
    limit_req_zone $binary_remote_addr zone=tx_detail_per_ip:1m rate=60r/m;
    # Plafonds (#46) : un agrégat par compte, lu à l'ouverture de l'accueil.
    limit_req_zone $binary_remote_addr zone=limits_per_ip:1m rate=60r/m;

    # DELETE et PATCH ne sont ouverts au CRS (ALLOWED_METHODS) que pour un bénéficiaire (#43), les
    # réglages d'une carte (#47) et un virement programmé (#48) : ailleurs ils restent refusés (405).
    map "$request_method:$uri" $method_denied {
        default 0;
        "~^DELETE:(?!/api/v1/(beneficiaries|scheduled-transfers)/[0-9]+$)" 1;
        "~^PATCH:(?!/api/v1/(cards|scheduled-transfers)/[0-9]+$)" 1;
    }

    # Cartes (#47) : gel/dégel et réglages, bornés par IP.
    limit_req_zone $binary_remote_addr zone=cards_per_ip:1m rate=60r/m;
    # Virements programmés (#48) : création / pause / annulation, bornées par IP.
    limit_req_zone $binary_remote_addr zone=schedules_per_ip:1m rate=60r/m;
    # Notifications (#49) : polling de la cloche (~2/min par onglet) + marquage lu.
    limit_req_zone $binary_remote_addr zone=notifications_per_ip:1m rate=60r/m;
    # Relevés (#50) : export coûteux (jusqu'à 5 000 lignes) et sensible -> 10 par minute et par IP.
    limit_req_zone $binary_remote_addr zone=statements_per_ip:1m rate=10r/m;

    # Le conteneur front (nginx non-root) écoute sur 8080, pas 80.
    upstream front_app    { server front:8080; }
    # Répliques de payment-api (deploy.replicas) : DNS Docker relu toutes les 5 s (`resolve`, nginx >= 1.27.3),
    # répartition least_conn, réplique retirée 5 s après 2 échecs. Les autres upstreams sont uniques.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream payment_api {
        zone payment_api 64k;
        least_conn;
        server payment-api:8001 resolve max_fails=2 fail_timeout=5s;
    }
    upstream auth_api     { server auth:8002; }

    # HTTP clair (hôte :80) : uniquement la sonde de vie et une redirection vers HTTPS. Jamais de
    # mot de passe ni de jeton en clair sur le réseau du hotspot.
    server {
        listen 8080;
        server_name _;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # Certificat auto-signé généré au build de l'image (voir Dockerfile).
        ssl_certificate     /etc/nginx/conf/server.crt;
        ssl_certificate_key /etc/nginx/conf/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:WAF:10m;

        # Blocage des sources mises en liste noire par la remédiation.
        if ($blocked_source) { return 403; }
        if ($method_denied)  { return 405; }

        # En-têtes de sécurité
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # Le navigateur ne retentera plus jamais en HTTP clair (certificat auto-signé : pas de preload).
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Sonde de vie du WAF lui-même (HEALTHCHECK de l'image / Compose) : ne touche aucun upstream.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Front de paiement (statique)
        location / {
            proxy_pass http://front_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API métier
        # Bascule vers une autre réplique sur erreur de connexion / 502 / 503. Jamais pour un POST déjà
        # transmis (nginx exclut les requêtes non idempotentes sans `non_idempotent`) : un virement n'est
        # jamais rejoué en double. Connexion bornée à 2 s : une réplique morte (IP qui ne répond plus) est
        # abandonnée à temps pour basculer avant le timeout des clients (60 s par défaut sinon).
        location /api/v1/accounts      { limit_req zone=api burst=60 nodelay; proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location ~ ^/api/v1/transactions/[0-9]+$ { limit_req zone=tx_detail_per_ip burst=20 nodelay; limit_req zone=api burst=60 nodelay; limit_except GET { deny all; } proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/transactions  { limit_req zone=api burst=60 nodelay; proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/beneficiaries { limit_req zone=beneficiaries_per_ip burst=10 nodelay; limit_req zone=api burst=60 nodelay; proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/scheduled-transfers { limit_req zone=schedules_per_ip burst=20 nodelay; limit_req zone=api burst=60 nodelay; proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/notifications { limit_req zone=notifications_per_ip burst=20 nodelay; limit_req zone=api burst=60 nodelay; proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/cards         { limit_req zone=cards_per_ip burst=20 nodelay; limit_req zone=api burst=60 nodelay; proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location = /api/v1/statements  { limit_req zone=statements_per_ip burst=5 nodelay; limit_req zone=api burst=60 nodelay; limit_except GET { deny all; } proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location = /api/v1/limits      { limit_req zone=limits_per_ip burst=20 nodelay; limit_req zone=api burst=60 nodelay; limit_except GET { deny all; } proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location = /api/v1/stats/spending { limit_req zone=stats_per_ip burst=20 nodelay; limit_req zone=api burst=60 nodelay; limit_except GET { deny all; } proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location = /api/v1/status      { limit_req zone=status_per_ip burst=5 nodelay; limit_req zone=api burst=60 nodelay; limit_except GET { deny all; } proxy_pass http://payment_api; proxy_next_upstream error timeout http_502 http_503; proxy_next_upstream_tries 3; proxy_connect_timeout 2s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }

        # API d'authentification (rate-limit applicatif en plus du CRS)
        location /api/v1/login     { limit_req zone=api burst=60 nodelay; proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/register  { limit_req zone=api burst=60 nodelay; proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
        location /api/v1/auth/     { limit_req zone=api burst=60 nodelay; proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }

        # Jamais routés : /internal/*, /metrics des services, moteur de remédiation, dashboard interne.
        # `location /` transmettant tout au front, /metrics est explicitement refusé (sonde interne).
        location = /metrics { return 404; }
    }
}
