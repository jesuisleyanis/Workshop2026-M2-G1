# Liste de blocage IP — gérée par l'action de remédiation waf_block_ip / waf_blacklist_ip.
# Format geo : "<ip> 1;" marque la source comme bloquée (renvoie 403 dans nginx.conf).
# Vide par défaut. La remédiation ajoute des lignes puis déclenche `nginx -s reload`.
# Exemple (ne pas committer de vraie IP) :
#   192.168.137.50 1;
